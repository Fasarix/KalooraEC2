# 02-workers.yml — Join dei nodi worker al cluster Kubernetes
---
- name: Esegui il join dei nodi worker al cluster
  hosts: workers
  become: true

  tasks:

    - name: Leggi il comando join dal controller
      set_fact:
        join_command: "{{ lookup('file', '/tmp/k8s_join_command.sh') | trim }}"

    - name: Verifica se il nodo fa già parte del cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: already_joined

    # Se la VM aveva configurazioni residue da precedenti esecuzioni, esegui reset prima del join
    - name: Prepara il nodo per il join se necessario
      command: kubeadm reset -f
      when: not already_joined.stat.exists

    - name: Esegui il join al cluster Kubernetes
      command: "{{ join_command }}"
      when: not already_joined.stat.exists

# ── Verifica dal Control Plane ─────────────────────────────────────────────
- name: Verifica che tutti i nodi risultino in stato Ready
  hosts: control_plane[0]
  become: false

  tasks:

    - name: Attendi che tutti i nodi raggiungano lo stato Ready
      command: kubectl get nodes
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: nodes_output
      until: nodes_output.stdout_lines | select('search', 'NotReady') | list | length == 0
      retries: 20
      delay: 15
      changed_when: false

    - name: Assegna la label del ruolo 'worker' ai nodi worker
      command: kubectl label node {{ item }} node-role.kubernetes.io/worker=worker --overwrite
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      loop: "{{ groups['workers'] }}"
      ignore_errors: true

    - name: Stampa lo stato finale di tutti i nodi del cluster
      debug:
        msg: "{{ nodes_output.stdout_lines }}"


    - name: Rimuovi il file temporaneo con il token di join per sicurezza
      file:
        path: /tmp/k8s_join_command.sh
        state: absent
      delegate_to: localhost
      run_once: true

