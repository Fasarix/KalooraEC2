name: Kaloora Cloud CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: kaloora

jobs:
  # ── FASE 1: DevSecOps Scans (Checkov, Gitleaks, Semgrep) ─────────────────────
  security-scans:
    name: Security & SAST Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST Scan (Node.js & Python)
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages semgrep || pip install semgrep || true
          semgrep scan --config auto --error services/ || true

      - name: Checkov IaC Scan (K8s & Terraform)
        continue-on-error: true
        run: |
          pip install --break-system-packages checkov || pip install checkov || true
          checkov -d k8s/ --framework kubernetes --soft-fail || true
          checkov -d terraform/ --framework terraform --soft-fail || true

  # ── FASE 2: Build & Push Immagini Docker su ECR ──────────────────────────────
  build-and-push:
    name: Build & Push Container Images to ECR
    needs: security-scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Microservizi (linux/amd64)
        id: build-images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for SERVICE in user-service diary-service analytics-service; do
            echo "--> Building & pushing ${SERVICE} for linux/amd64..."
            docker buildx build --platform linux/amd64 \
              -t $REGISTRY/${{ env.PROJECT_NAME }}/${SERVICE}:${IMAGE_TAG} \
              -t $REGISTRY/${{ env.PROJECT_NAME }}/${SERVICE}:v1.0.0 \
              --push services/${SERVICE}
          done

  # ── FASE 3: Deploy Frontend su S3 & Invalidate CloudFront ────────────────────
  deploy-frontend:
    name: Deploy Frontend to S3 & CloudFront
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Sync Static Files to S3
        env:
          S3_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            S3_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, '${{ env.PROJECT_NAME }}-frontend')].Name" --output text | awk '{print $1}')
          fi
          if [ -z "$S3_BUCKET" ]; then
            echo "❌ S3_FRONTEND_BUCKET non trovato su AWS."
            exit 1
          fi
          echo "Sincronizzazione su s3://${S3_BUCKET}..."
          aws s3 sync frontend/ s3://${S3_BUCKET}/ --exclude "Dockerfile" --exclude "nginx.conf" --delete

      - name: Invalidate CloudFront Cache
        env:
          CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$CLOUDFRONT_DIST_ID" ]; then
            CLOUDFRONT_DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].Id, '${{ env.PROJECT_NAME }}') || contains(Comment, '${{ env.PROJECT_NAME }}')].Id" --output text | awk '{print $1}')
          fi
          if [ -n "$CLOUDFRONT_DIST_ID" ] && [ "$CLOUDFRONT_DIST_ID" != "None" ]; then
            echo "Invalidazione CloudFront ${CLOUDFRONT_DIST_ID}..."
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DIST_ID" --paths "/*" || true
          fi

  # ── FASE 4: Deploy Kubernetes Manifests via AWS SSM ─────────────────────────
  deploy-k8s:
    name: Deploy Microservices to Kubernetes Cluster via AWS SSM
    needs: [build-and-push, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy Manifests to Control Plane using AWS SSM
        env:
          CONTROL_PLANE_ID: ${{ secrets.CONTROL_PLANE_INSTANCE_ID }}
        run: |
          if [ -z "$CONTROL_PLANE_ID" ]; then
            CONTROL_PLANE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-control-plane-1" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
          fi
          if [ -z "$CONTROL_PLANE_ID" ] || [ "$CONTROL_PLANE_ID" = "None" ]; then
            echo "❌ Control Plane EC2 instance non trovata."
            exit 1
          fi

          echo "1. Estrazione segreti da AWS SSM Parameter Store e Registry ECR..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          ECR_PASS=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          JWT_SEC=$(aws ssm get-parameter --name "/${{ env.PROJECT_NAME }}/jwt_secret" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")
          DB_P=$(aws ssm get-parameter --name "/${{ env.PROJECT_NAME }}/db_password" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")
          REDIS_TOKEN=$(aws ssm get-parameter --name "/${{ env.PROJECT_NAME }}/redis_auth_token" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")
          PG_HOST=$(aws ssm get-parameter --name "/${{ env.PROJECT_NAME }}/postgres_host" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          REDIS_HOST=$(aws ssm get-parameter --name "/${{ env.PROJECT_NAME }}/redis_host" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          SQS_URL=$(aws ssm get-parameter --name "/${{ env.PROJECT_NAME }}/sqs_queue_url" --query "Parameter.Value" --output text 2>/dev/null || echo "")

          # Impacchetta i manifesti K8s aggiornati dal commit corrente
          K8S_TAR_B64=$(tar -czf - -C k8s . | base64 | tr -d '\n')

          echo "2. Preparazione ed invio script di deploy al Control Plane ($CONTROL_PLANE_ID)..."
          DEPLOY_SCRIPT=$(cat << EOF
su - ubuntu -c '
export KUBECONFIG=/home/ubuntu/.kube/config

# 1. Aggiorna i manifesti K8s dal commit corrente
mkdir -p /home/ubuntu/k8s
echo "${K8S_TAR_B64}" | base64 -d | tar -xzf - -C /home/ubuntu/k8s/

# 2. Namespace e NetworkPolicies
kubectl apply -f /home/ubuntu/k8s/namespace.yaml
kubectl apply -f /home/ubuntu/k8s/network-policy.yaml

# 3. Secret ECR e applicativi
kubectl create secret docker-registry ecr-secret -n kaloora --docker-server=${ECR_REGISTRY} --docker-username=AWS --docker-password="${ECR_PASS}" --dry-run=client -o yaml | kubectl apply -f -
kubectl patch serviceaccount default -n kaloora -p "{\"imagePullSecrets\": [{\"name\": \"ecr-secret\"}]}" || true
if [ -f /home/ubuntu/k8s/ecr-cronjob.yaml ]; then
  kubectl apply -f /home/ubuntu/k8s/ecr-cronjob.yaml
fi

kubectl create secret generic kaloora-secrets -n kaloora \
  --from-literal=jwt-secret="${JWT_SEC}" \
  --from-literal=postgres-host="${PG_HOST}" \
  --from-literal=postgres-password="${DB_P}" \
  --from-literal=postgres-user=postgres \
  --from-literal=postgres-db=userdb \
  --from-literal=redis-host="${REDIS_HOST}" \
  --from-literal=redis-auth-token="${REDIS_TOKEN}" \
  --from-literal=sqs-queue-url="${SQS_URL}" \
  --from-literal=aws-region=${{ env.AWS_REGION }} \
  --from-literal=dynamodb-diary-table=kaloora-diary \
  --from-literal=dynamodb-foods-table=kaloora-foods \
  --dry-run=client -o yaml | kubectl apply -f -

# 4. Aggiornamento immagini e applicazione componenti
sed -i "s|image: user-service:v1.0.0|image: ${ECR_REGISTRY}/${{ env.PROJECT_NAME }}/user-service:v1.0.0|g" /home/ubuntu/k8s/user-service.yaml
sed -i "s|image: diary-service:v1.0.0|image: ${ECR_REGISTRY}/${{ env.PROJECT_NAME }}/diary-service:v1.0.0|g" /home/ubuntu/k8s/diary-service.yaml
sed -i "s|image: analytics-service:v1.0.0|image: ${ECR_REGISTRY}/${{ env.PROJECT_NAME }}/analytics-service:v1.0.0|g" /home/ubuntu/k8s/analytics-service.yaml

kubectl apply -f /home/ubuntu/k8s/ingress-nginx.yaml
kubectl apply -f /home/ubuntu/k8s/user-service.yaml
kubectl apply -f /home/ubuntu/k8s/diary-service.yaml
kubectl apply -f /home/ubuntu/k8s/analytics-service.yaml
kubectl apply -f /home/ubuntu/k8s/hpa-pdb.yaml || true
kubectl apply -f /home/ubuntu/k8s/ingress.yaml

# 5. Rollout e popolamento seed
kubectl rollout restart deployment user-service diary-service analytics-service -n kaloora || true
sleep 3
kubectl rollout status deployment diary-service -n kaloora --timeout=120s || true
POD=\$(kubectl get pods -n kaloora -l app=diary-service -o jsonpath="{.items[0].metadata.name}" 2>/dev/null || true)
if [ -n "\$POD" ]; then
  kubectl exec -n kaloora "\$POD" -- env PYTHONPATH=/app python /app/seeds/recipe_seed.py || true
fi
'
EOF
)
          B64_SCRIPT=$(echo "$DEPLOY_SCRIPT" | base64 | tr -d '\n')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$CONTROL_PLANE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[\"echo $B64_SCRIPT | base64 -d | bash\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM inviato. Command ID: $COMMAND_ID"
          echo "Attesa completamento esecuzione..."
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$CONTROL_PLANE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deploy completato con successo via AWS Systems Manager!"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$CONTROL_PLANE_ID" --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deploy fallito con stato: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$CONTROL_PLANE_ID" --query "StandardErrorContent" --output text
              exit 1
            fi
            echo "Stato attuale: $STATUS... attendo 10s (tentativo $i/30)"
            sleep 10
          done
          echo "⚠️ Timeout attesa SSM raggiunto. Verificare lo stato direttamente sul cluster."

